name: studyhub
description: A small local study library and navigation prototype.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  html: ^0.15.7
  crypto: ^3.0.7
  jose: ^0.3.5+2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/studyhub-logo.png
