<text x="110" y="830" font-family="Comic Sans MS, Chalkboard SE, cursive" font-size="30" fill="#243653">ΣF_x = F_push − f = 12 − 6 = 6 N</text>
<text x="110" y="890" font-family="Comic Sans MS, Chalkboard SE, cursive" font-size="30" fill="#243653">ma_x = (2 kg)(3 m/s²) = 6 N</text>
